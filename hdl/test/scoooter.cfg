adapter driver remote_bitbang

if {![info exists SCOOOTER_JTAG_SOCKET]} {
    set SCOOOTER_JTAG_SOCKET /tmp/jtag.sock
}
if {![info exists SCOOOTER_HART_COUNT]} {
    set SCOOOTER_HART_COUNT 1
}

remote_bitbang port 0
remote_bitbang host $SCOOOTER_JTAG_SOCKET

transport select jtag
jtag newtap scoooter cpu -irlen 5 -ircapture 0x01 -irmask 0x1f -expected-id 0x14567047

for {set hart 0} {$hart < $SCOOOTER_HART_COUNT} {incr hart} {
    target create scoooter.hart$hart riscv -chain-position scoooter.cpu -coreid $hart
}

init
