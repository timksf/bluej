adapter driver remote_bitbang
remote_bitbang port 0
remote_bitbang host /tmp/jtag.sock

transport select jtag
jtag newtap scoooter cpu -irlen 5 -ircapture 0x01 -irmask 0x1f -expected-id 0x14567047
target create scoooter.hart0 riscv -chain-position scoooter.cpu -coreid 0

set SCOOOTER_BLUEBUS_INSTRUCTION 0x12
set SCOOOTER_BLUEBUS_DR_BITS 68
set SCOOOTER_BLUEBUS_IGNORE 0x80000000000000000

proc scoooter_bluebus_wait_response {} {
    global SCOOOTER_BLUEBUS_DR_BITS SCOOOTER_BLUEBUS_IGNORE

    for {set attempt 0} {$attempt < 100} {incr attempt} {
        set response_hex [drscan scoooter.cpu $SCOOOTER_BLUEBUS_DR_BITS $SCOOOTER_BLUEBUS_IGNORE]
        set flags_hex [string index $response_hex end-16]
        set flags [expr "0x$flags_hex"]
        if {[expr {($flags & 2) != 0}]} {
            if {[expr {($flags & 4) != 0}]} {
                error "BlueBus request failed"
            }
            set data_hex [string range $response_hex end-7 end]
            return [expr "0x$data_hex"]
        }
        runtest 1
    }

    error "timed out waiting for BlueBus response"
}

proc bluebus_read32 {addr} {
    global SCOOOTER_BLUEBUS_INSTRUCTION SCOOOTER_BLUEBUS_DR_BITS

    set addr [expr {$addr & 0xffffffff}]
    irscan scoooter.cpu $SCOOOTER_BLUEBUS_INSTRUCTION
    runtest 1
    drscan scoooter.cpu $SCOOOTER_BLUEBUS_DR_BITS [format "0x0%08x00000000" $addr]
    runtest 10
    return [scoooter_bluebus_wait_response]
}

proc bluebus_write32 {addr data} {
    global SCOOOTER_BLUEBUS_INSTRUCTION SCOOOTER_BLUEBUS_DR_BITS

    set addr [expr {$addr & 0xffffffff}]
    set data [expr {$data & 0xffffffff}]
    set request [format "0x1%08x%08x" $addr $data]
    irscan scoooter.cpu $SCOOOTER_BLUEBUS_INSTRUCTION
    runtest 1
    drscan scoooter.cpu $SCOOOTER_BLUEBUS_DR_BITS $request
    runtest 10
    scoooter_bluebus_wait_response
}

init
