# External debugger wiring on the Cmod DIP header:
#   DIP 18 = TCK, DIP 19 = TMS, DIP 20 = TDI, DIP 21 = TDO

source [find interface/jlink.cfg]

if {![info exists SCOOOTER_JTAG_KHZ]} {
    set SCOOOTER_JTAG_KHZ 4000
}

set SCOOOTER_SYSTEM_HZ       50000000
set SCOOOTER_UART_BASE       0x40000000
set SCOOOTER_UART_MIV        [expr {$SCOOOTER_UART_BASE + 0x00}]
set SCOOOTER_UART_CTRL       [expr {$SCOOOTER_UART_BASE + 0x04}]
set SCOOOTER_UART_BAUD       [expr {$SCOOOTER_UART_BASE + 0x08}]
set SCOOOTER_UART_STATUS     [expr {$SCOOOTER_UART_BASE + 0x0c}]
set SCOOOTER_UART_TXDATA     [expr {$SCOOOTER_UART_BASE + 0x10}]
set SCOOOTER_UART_TXBUSY     0x00000100
set SCOOOTER_UART_TXREADY    0x00000400

proc scoooter_uart_read32 {address} {
    return [lindex [read_memory $address 32 1] 0]
}

proc scoooter_uart_wait_status {mask value timeout_ms description} {
    global SCOOOTER_UART_STATUS

    for {set elapsed_ms 0} {$elapsed_ms < $timeout_ms} {incr elapsed_ms} {
        set status [scoooter_uart_read32 $SCOOOTER_UART_STATUS]
        if {[expr {$status & $mask}] == $value} {
            return
        }
        sleep 1
    }

    set status [scoooter_uart_read32 $SCOOOTER_UART_STATUS]
    error [format "timeout waiting for UART %s; STATUS=0x%08x" \
        $description $status]
}

proc scoooter_uart_init {{baud 115200}} {
    global SCOOOTER_SYSTEM_HZ
    global SCOOOTER_UART_MIV
    global SCOOOTER_UART_CTRL
    global SCOOOTER_UART_BAUD
    global SCOOOTER_UART_TXREADY

    if {$baud <= 0} {
        error "UART baud rate must be greater than zero"
    }

    set prescaler [expr {($SCOOOTER_SYSTEM_HZ + ($baud / 2)) / $baud}]
    if {$prescaler < 1 || $prescaler > 65535} {
        error [format "UART baud %d requires out-of-range prescaler %d" \
            $baud $prescaler]
    }

    set miv [scoooter_uart_read32 $SCOOOTER_UART_MIV]
    if {$miv != 0x0001000d} {
        error [format "unexpected UART MIV 0x%08x at 0x%08x" \
            $miv $SCOOOTER_UART_MIV]
    }

    mww $SCOOOTER_UART_BAUD $prescaler
    mww $SCOOOTER_UART_CTRL 1
    scoooter_uart_wait_status $SCOOOTER_UART_TXREADY \
        $SCOOOTER_UART_TXREADY 1000 "TX ready"

    echo [format "SCOoOTER UART configured for %d baud (prescaler %d)" \
        $baud $prescaler]
}

proc scoooter_uart_putc {value} {
    global SCOOOTER_UART_TXDATA
    global SCOOOTER_UART_TXREADY

    if {$value < 0 || $value > 255} {
        error [format "UART byte is out of range: %d" $value]
    }

    scoooter_uart_wait_status $SCOOOTER_UART_TXREADY \
        $SCOOOTER_UART_TXREADY 1000 "TX FIFO space"
    # TXDATA is an 8-bit FIFO CSR and accepts only the low byte lane.
    mwb $SCOOOTER_UART_TXDATA $value
}

proc scoooter_uart_send {text} {
    global SCOOOTER_UART_TXBUSY

    foreach character [split $text ""] {
        scan $character %c value
        scoooter_uart_putc $value
    }

    scoooter_uart_wait_status $SCOOOTER_UART_TXBUSY 0 1000 "TX idle"
}

proc scoooter_uart_test {} {
    scoooter_uart_init 115200
    scoooter_uart_send "UART OK!\r\n"
}

transport select jtag
adapter speed $SCOOOTER_JTAG_KHZ
reset_config none

jtag newtap scoooter cpu -irlen 5 -ircapture 0x01 -irmask 0x1f \
    -expected-id 0x14567047
target create scoooter.hart0 riscv -chain-position scoooter.cpu -coreid 0

init
